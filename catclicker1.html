<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img id="gat" src="img/cat1.jpg" alt="">
    <h3 id="contador">0</h3>
</body>

<script>
    let cont=0;
    document.getElementById("gat").addEventListener("click",function(){
            cont++;
            document.getElementById("contador").innerHTML=cont;

    })
</script>
</html>
